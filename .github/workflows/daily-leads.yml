name: Daily leads

on:
  schedule:
    - cron: '30 3 * * *'   # 9:00 AM IST
  workflow_dispatch:        # lets the dashboard button and the Actions tab start it

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the official Freelancer.com SDK
        run: pip install freelancersdk || pip install "git+https://github.com/freelancer/freelancer-sdk-python.git"
      - run: python scripts/scrape.py
        env:
          APP_URL: ${{ secrets.APP_URL }}
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
          FREELANCER_OAUTH_TOKEN: ${{ secrets.FREELANCER_OAUTH_TOKEN }}
          RUN_ID: ${{ github.run_id }}
