name: Daily leads

on:
  schedule:
    - cron: '30 3 * * *'   # 9:00 AM IST: full scan of the last 30 days
    - cron: '15 * * * *'   # every hour: quick look at the newest posts
  workflow_dispatch:        # lets the dashboard button and the Actions tab start it
    inputs:
      unnamed:
        description: 'Also add website requests where Freelancer hides the buyer name (true/false)'
        default: 'false'

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the official Freelancer.com SDK
        run: pip install freelancersdk || pip install "git+https://github.com/freelancer/freelancer-sdk-python.git"
      - run: python scripts/scrape.py
        env:
          APP_URL: ${{ secrets.APP_URL }}
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
          FREELANCER_OAUTH_TOKEN: ${{ secrets.FREELANCER_OAUTH_TOKEN }}
          RUN_ID: ${{ github.run_id }}
          # hourly runs only read the newest pages (fast); the morning run and manual runs scan everything
          NAMELESS_MAX: ${{ github.event_name == 'workflow_dispatch' && inputs.unnamed == 'true' && '10' || '0' }}
          FL_PAGES: ${{ github.event.schedule == '15 * * * *' && '2' || '6' }}
          FL_MAX_AGE_DAYS: ${{ github.event.schedule == '15 * * * *' && '10' || '30' }}
